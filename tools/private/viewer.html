<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Geteiltes Ergebnis | LH.next</title>
<style>
  :root { --bg:#0b0f14; --surface:#131a23; --border:#223041; --text:#e7edf3; --dim:#9fb0c1; --accent:#ff5566; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f7f8fa; --surface:#fff; --border:#dde1e8; --text:#14181f; --dim:#454f5c; --accent:#d9364a; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--text);
         font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--surface);
           border-bottom:1px solid var(--border); }
  header strong span { color:var(--accent); }
  header p { margin:0; color:var(--dim); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button { padding:7px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg);
           color:var(--text); font:inherit; font-weight:600; cursor:pointer; }
  iframe { flex:1; width:100%; border:0; background:#fff; }
  #err { padding:32px 16px; text-align:center; color:var(--dim); }
</style>
</head>
<body>
<header>
  <strong>LH<span>.</span>next</strong>
  <p>Geteiltes Analyse-Ergebnis</p>
  <button id="dl" hidden>Herunterladen</button>
</header>
<p id="err" hidden>Dieser Link ist ungültig oder unvollständig.</p>
<iframe id="view" title="Geteiltes Ergebnis" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" hidden></iframe>
<script>
(async () => {
  const hash = location.hash.slice(1);
  try {
    if (!hash.startsWith('v1.')) throw new Error('format');
    const b64 = hash.slice(3).replace(/-/g, '+').replace(/_/g, '/');
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    const html = await new Response(stream).text();

    const frame = document.getElementById('view');
    frame.srcdoc = html;
    frame.hidden = false;

    const title = new DOMParser().parseFromString(html, 'text/html').title;
    if (title) document.querySelector('header p').textContent = title;

    const dl = document.getElementById('dl');
    dl.hidden = false;
    dl.onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      a.download = (title || 'ergebnis').replace(/[^\w\-äöüÄÖÜß ]+/g, '').trim() + '.html';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
  } catch {
    document.getElementById('err').hidden = false;
  }
})();
</script>
</body>
</html>
